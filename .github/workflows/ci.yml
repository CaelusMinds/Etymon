name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins the SDK; both target frameworks need their runtimes.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Expecto's own runner, not `dotnet test` -- see tests/Directory.Build.props.
      - name: Test (net8.0)
        run: dotnet run --project tests/Etymon.Core.Tests -c Release -f net8.0 --no-build -- --junit-summary test-results-net8.0-${{ matrix.os }}.xml

      - name: Test (net10.0)
        run: dotnet run --project tests/Etymon.Core.Tests -c Release -f net10.0 --no-build -- --junit-summary test-results-net10.0-${{ matrix.os }}.xml

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results-*.xml
          if-no-files-found: ignore

  format:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Fantomas
        run: dotnet fantomas --check src tests samples

  trim:
    name: trim analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Etymon.Core is meant to be small enough to travel into a Blazor
      # WebAssembly payload. This publishes a trimmed app that uses it and fails
      # on any trim warning attributable to Etymon.
      - name: Publish trimmed
        run: dotnet publish eng/TrimGate -c Release -f net10.0 -r linux-x64 /p:PublishTrimmed=true /p:TrimmerSingleWarn=false

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: [build, format]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink wants real history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet pack -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
