name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  CI: true

jobs:
  build:
    name: build & test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          # global.json pins the SDK; both target frameworks need their runtimes.
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore -c Release

      # Expecto's own runner, not `dotnet test` -- see tests/Directory.Build.props.
      # Every project on both target frameworks: a bug that only shows up on one
      # of them has already happened twice.
      - name: Test
        shell: bash
        run: |
          for project in tests/*.Tests; do
            for tfm in net8.0 net10.0; do
              name=$(basename "$project")
              echo "::group::$name $tfm"
              dotnet run --project "$project" -c Release -f "$tfm" --no-build -- \
                --junit-summary "test-results-$name-$tfm-${{ matrix.os }}.xml"
              echo "::endgroup::"
            done
          done

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: test-results-*.xml
          if-no-files-found: ignore

  format:
    name: format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet tool restore
      - name: Fantomas
        run: dotnet fantomas --check src tests samples bench

  trim:
    name: trim analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      # Etymon.Core is meant to be small enough to travel into a Blazor
      # WebAssembly payload. This publishes a trimmed app that uses it and fails
      # on any trim warning attributable to Etymon.
      - name: Publish trimmed
        run: dotnet publish eng/TrimGate -c Release -f net10.0 -r linux-x64 /p:PublishTrimmed=true /p:TrimmerSingleWarn=false

  docs:
    name: docs & sample
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet tool restore

      # The sample is the shortest honest description of what the suite does. If
      # it stops compiling or stops running, the README is lying.
      - name: Run the sample
        run: dotnet run --project samples/Etymon.Sample.Derivations -c Release

      # fsdocs reads the XML doc comments, so a malformed one breaks the site
      # rather than the build. Better to find that here than after a release.
      - name: Build the documentation site
        run: dotnet fsdocs build --clean --properties Configuration=Release

  pack:
    name: pack
    runs-on: ubuntu-latest
    needs: [build, format]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # SourceLink wants real history
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet pack -c Release
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg
