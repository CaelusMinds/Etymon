name: Release

# Publishing is never automatic. A release happens when a maintainer either
# pushes a v* tag or runs this workflow by hand, and the push to NuGet sits
# behind a GitHub environment so it can require an approval.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not push to NuGet"
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      # Lets the job ask GitHub for an OIDC token, which nuget.org exchanges for
      # a key valid for one hour. Nothing long-lived is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The tag is the whole version, suffix included. Checking only the prefix
      # would let a v0.1.0 tag publish 0.1.0-preview.1, because VersionSuffix
      # defaults to a preview and nothing here would have cleared it -- a
      # release labelled stable that is not one, and a version number burned.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          prefix="${tag%%-*}"
          suffix=""
          if [ "$tag" != "$prefix" ]; then suffix="${tag#*-}"; fi
          declared=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          if [ "$prefix" != "$declared" ]; then
            echo "::error::Tag v$tag does not match VersionPrefix $declared in Directory.Build.props"
            exit 1
          fi
          # Empty suffix means a stable release; passing the property empty is
          # how Directory.Build.props says to clear it.
          echo "VERSION_ARG=-p:VersionSuffix=$suffix" >> "$GITHUB_ENV"
          echo "Releasing $tag"

      - name: Build
        shell: bash
        run: dotnet build -c Release ${VERSION_ARG}

      - name: Test
        shell: bash
        run: |
          # The same version properties as the build, or --no-build evaluates a
          # different property set than the one that produced the output.
          #
          # Grouped and named. A bare loop reports only "exit code 1", which
          # says a release was stopped and nothing about why -- and the run log
          # is not readable without admin rights, so the annotation has to carry
          # the answer on its own.
          failed=""

          for project in tests/*.Tests; do
            for tfm in net8.0 net10.0; do
              name="$(basename "$project") $tfm"
              echo "::group::$name"

              if dotnet run --project "$project" -c Release -f "$tfm" --no-build ${VERSION_ARG}; then
                echo "::endgroup::"
              else
                echo "::endgroup::"
                echo "::error::$name failed. The release was stopped before anything was published."
                failed="$failed
            $name"
              fi
            done
          done

          if [ -n "$failed" ]; then
            echo "::error::Release halted. Failing test projects:$failed"
            exit 1
          fi

      - name: Pack
        shell: bash
        run: dotnet pack -c Release --no-build ${VERSION_ARG}

      - uses: actions/upload-artifact@v7
        with:
          name: packages
          path: artifacts/packages/*.nupkg

      # NuGet/login fails with "Input required and not supplied: user" when the
      # secret is missing, which says nothing about where the secret should be.
      # Checking it here turns that into an instruction.
      - name: Check the publishing identity is configured
        shell: bash
        env:
          NUGET_USER: ${{ secrets.NUGET_USER }}
        run: |
          if [ -z "${NUGET_USER}" ]; then
            echo "::error::NUGET_USER is empty. It must be a *secret* (not a variable) named exactly NUGET_USER, on this repository -- CaelusMinds/Etymon, not a fork or mirror -- either as a repository secret or on the 'nuget' environment. Its value is the nuget.org profile name that owns the trusted-publishing policy."
            exit 1
          fi
          echo "Publishing as ${NUGET_USER}"

      # Trusted Publishing. The key is requested immediately before the push
      # because it expires in an hour, and each OIDC token buys exactly one key.
      #
      # Deliberately not gated on the tag: a dry run that skips this proves the
      # build and proves nothing about publishing, which is the half most likely
      # to be misconfigured. Obtaining a key has no outward effect -- it expires
      # unused -- so the rehearsal exercises everything except the push itself.
      - name: Exchange an OIDC token for a short-lived NuGet key
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
