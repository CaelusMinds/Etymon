name: Release

# Publishing is never automatic. A release happens when a maintainer either
# pushes a v* tag or runs this workflow by hand, and the push to NuGet sits
# behind a GitHub environment so it can require an approval.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      dry-run:
        description: "Build and pack, but do not push to NuGet"
        type: boolean
        default: true

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  CI: true

jobs:
  release:
    runs-on: ubuntu-latest
    environment: nuget
    permissions:
      contents: read
      # Lets the job ask GitHub for an OIDC token, which nuget.org exchanges for
      # a key valid for one hour. Nothing long-lived is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      # The tag is the whole version, suffix included. Checking only the prefix
      # would let a v0.1.0 tag publish 0.1.0-preview.1, because VersionSuffix
      # defaults to a preview and nothing here would have cleared it -- a
      # release labelled stable that is not one, and a version number burned.
      - name: Resolve the version from the tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          tag="${GITHUB_REF#refs/tags/v}"
          prefix="${tag%%-*}"
          suffix=""
          if [ "$tag" != "$prefix" ]; then suffix="${tag#*-}"; fi
          declared=$(grep -oP '(?<=<VersionPrefix>)[^<]+' Directory.Build.props)
          if [ "$prefix" != "$declared" ]; then
            echo "::error::Tag v$tag does not match VersionPrefix $declared in Directory.Build.props"
            exit 1
          fi
          # Empty suffix means a stable release; passing the property empty is
          # how Directory.Build.props says to clear it.
          echo "VERSION_ARG=-p:VersionSuffix=$suffix" >> "$GITHUB_ENV"
          echo "Releasing $tag"

      - name: Build
        shell: bash
        run: dotnet build -c Release ${VERSION_ARG}

      - name: Test
        shell: bash
        run: |
          # The same version properties as the build, or --no-build evaluates a
          # different property set than the one that produced the output.
          for project in tests/*.Tests; do
            for tfm in net8.0 net10.0; do
              dotnet run --project "$project" -c Release -f "$tfm" --no-build ${VERSION_ARG}
            done
          done

      - name: Pack
        shell: bash
        run: dotnet pack -c Release --no-build ${VERSION_ARG}

      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: artifacts/packages/*.nupkg

      # Trusted Publishing. The key is requested immediately before the push
      # because it expires in an hour, and each OIDC token buys exactly one key.
      - name: Exchange an OIDC token for a short-lived NuGet key
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        if: startsWith(github.ref, 'refs/tags/v') && inputs.dry-run != true
        run: >
          dotnet nuget push "artifacts/packages/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.nuget-login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
