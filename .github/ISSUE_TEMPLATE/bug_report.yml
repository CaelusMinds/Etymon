name: Bug report
description: Something behaves differently from what its documentation says.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. The most useful bug report is a failing snippet,
        so lead with that if you can.

  - type: dropdown
    id: package
    attributes:
      label: Package
      options:
        - Etymon
        - Etymon.Core
        - Etymon.Base
        - Etymon.Schema
        - Etymon.Schema.Compatibility
        - Etymon.Schema.OpenApi
        - Etymon.Schema.Sql
        - Etymon.Schema.TypeScript
        - Etymon.Invariants
        - Etymon.Invariants.FsCheck
        - Etymon.Config
        - Etymon.Api
        - Etymon.Api.Client
        - Etymon.Api.AspNetCore
        - Etymon.Api.Giraffe
        - Not sure
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "0.1.0-preview.7"
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The smallest F# that shows the problem.
      render: fsharp
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What you expected, and what happened instead
    validations:
      required: true

  # A signature can compile in this repository and fail in yours purely on
  # these two settings -- WireField shipped in preview.5 typed against
  # unannotated records and failed at every call site in a project with
  # nullness on. Asking here saves a round trip on that whole class of bug.
  - type: input
    id: fsharp
    attributes:
      label: FSharp.Core version, and is `<Nullable>enable</Nullable>` set?
      placeholder: "8.0.100, nullness enabled"
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: .NET SDK and OS
      placeholder: "10.0.400, Windows 11"
